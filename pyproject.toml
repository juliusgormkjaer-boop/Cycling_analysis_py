[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "power-report"
version = "0.1.0"
description = "Explainable analysis of cycling power, heart-rate and training load"
requires-python = ">=3.11"
dependencies = ["fitdecode>=0.10.0"]

[project.scripts]
power-report = "power_report.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools]
package-dir = {"" = "src"}
